<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A little question for you 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6f91;
    --pink-dark: #e0517a;
    --blush: #ffe3ec;
    --cream: #fff8f3;
    --ink: #4a2c3a;
    --soft: #8a6475;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Fredoka', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #ffd1e1, #ffe9d6, #f6d8ff, #d9e8ff, #ffd1e1);
    background-size: 400% 400%;
    animation: drift 22s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
  }

  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* polka dots */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.55) 2px, transparent 2.5px);
    background-size: 34px 34px;
    pointer-events: none;
    z-index: 0;
  }

  /* soft glowing blobs */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    pointer-events: none;
    z-index: 0;
    animation: wander 18s ease-in-out infinite alternate;
  }
  .b1 { width: 340px; height: 340px; background: #ff9bb8; top: -80px; left: -80px; }
  .b2 { width: 300px; height: 300px; background: #c9a7ff; bottom: -90px; right: -70px; animation-duration: 22s; }
  .b3 { width: 240px; height: 240px; background: #ffd29b; top: 55%; left: 8%; animation-duration: 26s; }
  @keyframes wander {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(60px, 40px) scale(1.12); }
    100% { transform: translate(-30px, 80px) scale(0.95); }
  }

  /* twinkling sparkles */
  .sparkle {
    position: fixed;
    color: white;
    pointer-events: none;
    z-index: 0;
    text-shadow: 0 0 8px rgba(255,255,255,0.9);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.6) rotate(0deg); }
    50%      { opacity: 1;    transform: scale(1.15) rotate(20deg); }
  }

  /* floating hearts that sway */
  .heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    z-index: 0;
    animation: floatUp linear forwards;
  }
  .heart span {
    display: inline-block;
    opacity: 0.75;
    animation: sway 3s ease-in-out infinite alternate;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh); opacity: 0; }
  }
  @keyframes sway {
    from { transform: translateX(-18px) rotate(-12deg); }
    to   { transform: translateX(18px) rotate(12deg); }
  }

  .card { backdrop-filter: blur(6px); background: rgba(255, 248, 243, 0.92); }

  .card {
    position: relative;
    z-index: 1;
    background: var(--cream);
    border-radius: 28px;
    padding: 36px 28px 32px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(224, 81, 122, 0.22);
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  .face {
    font-size: 84px;
    line-height: 1;
    display: inline-block;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }
  .face.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  h1 {
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    color: var(--pink-dark);
    font-size: 30px;
    margin: 18px 0 8px;
    line-height: 1.3;
  }
  .sub {
    color: var(--soft);
    font-size: 17px;
    min-height: 26px;
    margin-bottom: 26px;
  }

  .buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 70px;
  }
  button {
    font-family: inherit;
    font-weight: 600;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s, font-size 0.3s, padding 0.3s, background 0.2s;
  }
  button:active { transform: scale(0.95); }
  #yes {
    background: var(--pink);
    color: white;
    font-size: 20px;
    padding: 12px 34px;
    box-shadow: 0 6px 0 var(--pink-dark);
  }
  #yes:hover { background: var(--pink-dark); }
  #no {
    background: white;
    color: var(--soft);
    font-size: 18px;
    padding: 10px 26px;
    border: 2px solid #f1c6d3;
  }
  #no.runaway {
    position: fixed;
    z-index: 5;
    transition: left 0.25s, top 0.25s, font-size 0.3s, padding 0.3s;
  }

  /* celebration */
  .hidden { display: none; }
  .details {
    text-align: left;
    background: white;
    border-radius: 18px;
    padding: 18px 20px;
    margin: 22px 0 20px;
    border: 2px dashed #f7b6c9;
  }
  .details .row {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 9px 0;
    font-size: 16px;
  }
  .details .row + .row { border-top: 1px solid #fbe3ea; }
  .details .icon { font-size: 22px; line-height: 1.2; }
  .details strong { display: block; color: var(--pink-dark); font-weight: 600; }
  .details span { color: var(--soft); font-size: 15px; }
  #cal {
    background: var(--pink);
    color: white;
    font-size: 16px;
    padding: 11px 24px;
    box-shadow: 0 5px 0 var(--pink-dark);
  }
  .countdown {
    margin-top: 16px;
    font-size: 14px;
    color: var(--soft);
  }

  .confetti {
    position: fixed;
    top: -20px;
    font-size: 22px;
    pointer-events: none;
    z-index: 10;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); }
  }

  @media (max-width: 400px) {
    h1 { font-size: 25px; }
    .face { font-size: 70px; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- ASK -->
  <div class="card" id="askCard">
    <div class="face" id="face">🥺</div>
    <h1 id="question">Muskiii, will you go on a virtual date with me?</h1>
    <p class="sub" id="sub">Next Friday, 7 PM 💕</p>
    <div class="buttons">
      <button id="yes">Yes!</button>
      <button id="no">No</button>
    </div>
  </div>

  <!-- YAY -->
  <div class="card hidden" id="yayCard">
    <div class="face">🥰</div>
    <h1>Yaaay, Muskiii! It's a date!</h1>
    <p class="sub">I knew you'd say yes 😌</p>

    <div class="details">
      <div class="row">
        <div class="icon">📅</div>
        <div><strong id="dateText">Friday, October 30</strong><span>7:00 PM — clear your evening!</span></div>
      </div>
      <div class="row">
        <div class="icon">📺</div>
        <div><strong>Big Bang Theory marathon</strong><span>Same episode, same time, together</span></div>
      </div>
      <div class="row">
        <div class="icon">🍜</div>
        <div><strong>We order food for each other</strong><span>No peeking at what's coming 🤫</span></div>
      </div>
    </div>

    <button id="cal">Add to my calendar 🗓️</button>
    <p class="countdown" id="countdown"></p>
  </div>

<script>
  // ====== EDIT THESE ======
  const DATE = new Date(2026, 9, 30, 19, 0); // Oct 30 2026, 7:00 PM (months are 0-indexed)
  // =========================

  const noLines = [
    ["Are you sure? 🥺", "😢"],
    ["Think again! 🤔", "🥹"],
    ["Pretty please? 🙏", "😿"],
    ["Muskiii, you're literally named after a smile… don't make me frown 🥲", "😭"],
    ["I'll let you pick the episode!", "🫣"],
    ["I'll order you dessert too 🍰", "🥺"],
    ["You're breaking my heart 💔", "😩"],
    ["The No button is getting tired…", "😵‍💫"],
    ["Okay, now you HAVE to say yes 😤", "😤"],
    ["Just click the big pink one 👉", "🥺"],
  ];

  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const face = document.getElementById('face');
  const question = document.getElementById('question');
  const sub = document.getElementById('sub');
  let count = 0;

  no.addEventListener('click', () => {
    const [line, emoji] = noLines[Math.min(count, noLines.length - 1)];
    question.textContent = line;
    sub.textContent = count >= 2 ? "The answer is yes, right? 💕" : "Next Friday, 7 PM 💕";
    face.textContent = emoji;
    face.classList.remove('shake'); void face.offsetWidth; face.classList.add('shake');
    count++;

    // Yes grows, No shrinks
    const yesSize = 20 + count * 6;
    yes.style.fontSize = Math.min(yesSize, 64) + 'px';
    yes.style.padding = `${12 + count * 2}px ${34 + count * 6}px`;
    const noSize = Math.max(18 - count * 1.3, 10);
    no.style.fontSize = noSize + 'px';

    // After a few tries, No starts running away
    if (count >= 5) moveNo();
  });

  function moveNo() {
    no.classList.add('runaway');
    const card = document.getElementById('askCard').getBoundingClientRect();
    const yesRect = yes.getBoundingClientRect();
    const w = no.offsetWidth, h = no.offsetHeight;
    const pad = 12, reach = 40; // how far outside the card it may hop
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));

    let x, y, tries = 0;
    do {
      x = card.left - reach + Math.random() * (card.width + reach * 2 - w);
      y = card.top - reach + Math.random() * (card.height + reach * 2 - h);
      x = clamp(x, pad, window.innerWidth - w - pad);
      y = clamp(y, pad, window.innerHeight - h - pad);
      tries++;
    } while (
      tries < 20 &&
      x < yesRect.right + 8 && x + w > yesRect.left - 8 &&
      y < yesRect.bottom + 8 && y + h > yesRect.top - 8
    );
    no.style.left = x + 'px';
    no.style.top = y + 'px';
  }
  no.addEventListener('mouseenter', () => { if (count >= 5) moveNo(); });

  yes.addEventListener('click', () => {
    document.getElementById('askCard').classList.add('hidden');
    no.classList.add('hidden');
    document.getElementById('yayCard').classList.remove('hidden');
    burst();
    startCountdown();
  });

  // Back to the question (resets everything)
  document.getElementById('back')?.addEventListener('click', e => {
    e.preventDefault();
    count = 0;
    question.textContent = "Muskiii, will you go on a virtual date with me?";
    sub.textContent = "Next Friday, 7 PM 💕";
    face.textContent = "🥺";
    yes.style.cssText = '';
    no.style.cssText = '';
    no.classList.remove('runaway', 'hidden');
    document.getElementById('yayCard').classList.add('hidden');
    document.getElementById('askCard').classList.remove('hidden');
  });

  // Date text
  document.getElementById('dateText').textContent =
    DATE.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

  // Countdown
  function startCountdown() {
    const el = document.getElementById('countdown');
    const tick = () => {
      const diff = DATE - new Date();
      if (diff <= 0) { el.textContent = "It's date time! 💞"; return; }
      const d = Math.floor(diff / 864e5);
      const h = Math.floor(diff / 36e5) % 24;
      const m = Math.floor(diff / 6e4) % 60;
      el.textContent = `Only ${d}d ${h}h ${m}m to go ⏳`;
    };
    tick(); setInterval(tick, 30000);
  }

  // Calendar (.ics)
  document.getElementById('cal').addEventListener('click', () => {
    const pad = n => String(n).padStart(2, '0');
    const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const end = new Date(DATE.getTime() + 3 * 3600e3);
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//date//EN','BEGIN:VEVENT',
      'UID:' + Date.now() + '@virtualdate',
      'DTSTART:' + fmt(DATE), 'DTEND:' + fmt(end),
      'SUMMARY:Virtual date 💕',
      'DESCRIPTION:Big Bang Theory together + ordering food for each other',
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'virtual-date.ics';
    a.click();
  });

  // Hearts + confetti
  const heartEmojis = ['💗','💕','💖','💘','🩷'];
  setInterval(() => {
    const h = document.createElement('div');
    h.className = 'heart';
    const s = document.createElement('span');
    s.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    s.style.animationDuration = 2 + Math.random() * 2 + 's';
    h.appendChild(s);
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = 14 + Math.random() * 20 + 'px';
    h.style.animationDuration = 7 + Math.random() * 6 + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 13000);
  }, 650);

  // Twinkling sparkles
  const sparkleChars = ['✦', '✧', '⋆', '✩'];
  for (let i = 0; i < 28; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    sp.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
    sp.style.left = Math.random() * 100 + 'vw';
    sp.style.top = Math.random() * 100 + 'vh';
    sp.style.fontSize = 10 + Math.random() * 14 + 'px';
    sp.style.animationDuration = 2 + Math.random() * 3 + 's';
    sp.style.animationDelay = Math.random() * 4 + 's';
    document.body.appendChild(sp);
  }

  function burst() {
    const bits = ['💖','🎉','✨','💕','🍕','🍜','📺','🥳'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = bits[Math.floor(Math.random() * bits.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
      c.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }
</script>
</body>
</html>
